[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dailydl-cli"
version = "4.0.0"
description = "A focused Dailymotion downloader with interactive and batch workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp[curl-cffi]>=2026.8.19", "rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "ruff>=0.13,<1"]

[project.scripts]
dailydl = "dailydl_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
